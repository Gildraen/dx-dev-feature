name: release

on:
  release:
    types:
      - published

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish-feature:
    if: vars.FEATURE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Confirm release tag matches the Feature version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          feature_version="$(node -p "require('./src/dx/devcontainer-feature.json').version")"
          test "$RELEASE_TAG" = "$feature_version"
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          features-namespace: "gildraen/dx"
          generate-docs: "false"
          disable-repo-tagging: "true"
          devcontainer-cli-version: "0.88.0"
        env:
          GITHUB_TOKEN: ${{ github.token }}