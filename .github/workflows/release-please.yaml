name: release-please

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
    uses: Gildraen/ci-workflows/.github/workflows/reusable-release-please.yml@eabb9d61ea2a827476f46e7e3e9577d956d8f470 # 0.2.0
    with:
      expected-sha: ${{ github.event.workflow_run.head_sha }}
      app-client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}